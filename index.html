<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SQL-Gen AI | مولد استعلامات SQL</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap');
        body { font-family: 'Tajawal', sans-serif; scroll-behavior: smooth; }
        .gradient-text { background: linear-gradient(90deg, #2563eb, #7c3aed); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900">

    <nav class="sticky top-0 z-50 border-b bg-white/80 backdrop-blur-md">
        <div class="max-w-6xl mx-auto px-4 h-16 flex justify-between items-center">
            <a href="#" class="text-2xl font-bold gradient-text">SQL-Gen AI</a>
            <div class="hidden md:flex space-x-6 space-x-reverse text-sm font-medium">
                <a href="#tool" class="hover:text-blue-600 transition">الأداة</a>
                <a href="#articles" class="hover:text-blue-600 transition">تعليم SQL</a>
            </div>
        </div>
    </nav>

    <section id="tool" class="py-12 md:py-20 px-4">
        <div class="max-w-4xl mx-auto text-center">
            <h2 class="text-4xl md:text-5xl font-extrabold mb-6">حول لغتك الطبيعية إلى <span class="gradient-text">أكواد SQL</span></h2>
            
            <div class="bg-white p-6 md:p-8 rounded-3xl shadow-2xl border border-slate-100">
                <textarea id="promptInput" rows="4" 
                    class="w-full p-5 bg-slate-50 border-2 border-slate-100 rounded-2xl focus:border-blue-500 outline-none text-lg text-right" 
                    placeholder="مثال: عرض كل الموظفين في قسم المبيعات..."></textarea>
                
                <button onclick="generateSQL()" id="mainBtn" 
                    class="w-full mt-6 bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 rounded-2xl shadow-lg transition-all flex justify-center items-center gap-2">
                    <span id="btnText">توليد الكود الآن ✨</span>
                </button>

                <div id="resultArea" class="hidden mt-8 text-right">
                    <div class="flex justify-between items-center mb-3">
                        <span class="bg-blue-100 text-blue-700 px-3 py-1 rounded-full text-xs font-bold uppercase tracking-widest">SQL Result</span>
                        <button onclick="copyCode()" class="text-blue-600 hover:bg-blue-50 px-3 py-1 rounded-lg text-sm font-medium border border-blue-100 transition">نسخ الكود</button>
                    </div>
                    <div class="bg-slate-900 rounded-2xl p-6 shadow-inner overflow-hidden border border-slate-800">
                        <code id="sqlOutput" class="text-blue-300 font-mono text-lg block whitespace-pre-wrap text-left" style="direction: ltr;"></code>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <footer class="bg-slate-900 text-slate-400 py-12 text-center">
        <p class="text-sm">© 2026 جميع الحقوق محفوظة | تطوير عبد الخالق</p>
    </footer>

    <script>
        async function generateSQL() {
            const btn = document.getElementById('mainBtn');
            const btnText = document.getElementById('btnText');
            const prompt = document.getElementById('promptInput').value;
            const resultArea = document.getElementById('resultArea');
            const output = document.getElementById('sqlOutput');
            
            // مفتاحك الجديد
            const API_KEY = "AIzaSyDTD-wnfUFkMS0JHpe2ZZGfJTVfuZDLaVU"; 

            if (!prompt) { alert("اكتب وصفاً للاستعلام أولاً"); return; }

            btnText.innerText = "جاري الاتصال بـ Gemini AI...";
            btn.disabled = true;

            try {
                // التغيير الحاسم: استخدام v1 بدلاً من v1beta وموديل gemini-1.5-flash الصافي
                const response = await fetch(`https://generativelanguage.googleapis.com/v1/models/gemini-1.5-flash:generateContent?key=${API_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: "Write ONLY the SQL code for: " + prompt }] }]
                    })
                });

                const data = await response.json();

                if (data.error) {
                    throw new Error(data.error.message);
                }

                if (data.candidates && data.candidates[0].content) {
                    let res = data.candidates[0].content.parts[0].text;
                    output.innerText = res.replace(/```sql|```/g, "").trim();
                    resultArea.classList.remove('hidden');
                    btnText.innerText = "توليد كود آخر ✨";
                    resultArea.scrollIntoView({ behavior: 'smooth' });
                }
            } catch (err) {
                console.error(err);
                alert("حدث خطأ تقني: " + err.message);
            } finally {
                btn.disabled = false;
                if(btnText.innerText !== "توليد كود آخر ✨") btnText.innerText = "توليد الكود الآن ✨";
            }
        }

        function copyCode() {
            const code = document.getElementById('sqlOutput').innerText;
            if(!code) return;
            navigator.clipboard.writeText(code).then(() => alert("تم نسخ الكود!"));
        }
    </script>
</body>
</html>
